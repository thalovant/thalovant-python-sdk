[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "thalovant"
version = "0.5.9"
description = "Python SDK and CLI for direct Thalovant hub data-plane clients and agents"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Thalovant" }]
maintainers = [{ name = "Thalovant" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["thalovant", "sdk", "agent", "voice", "assistant", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 1.1.1a1 is the floor for the v3 Noise handshake
    # (hivemind_bus_client.noise). HiveMind-core 5.0 made v3 the sole
    # transport crypto and closes anything that cannot complete it with a
    # 1008; 0.4.4 has no noise module at all.
    "hivemind-bus-client>=1.1.1a1",
    # the primitive hivemind_bus_client.noise imports. Without it
    # NOISE_SUPPORTED is False and HiveMindSlaveProtocol._should_use_noise
    # silently selects the legacy handshake the hub no longer offers.
    "poorman-handshake>=2.0.0a3",
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0.2",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://thalovant.com"
Documentation = "https://docs.thalovant.com/developers/sdks/python/"
Repository = "https://github.com/thalovant/thalovant-python-sdk"
Issues = "https://github.com/thalovant/thalovant-python-sdk/issues"

[project.scripts]
thalovant = "thalovant.cli:main"

[project.optional-dependencies]
# Test tooling only. twine lives in `publish` because it requires
# rich>=14.3.3 while ovos-utils (via hivemind-bus-client) pins rich~=13.7:
# installing both alongside the package is unresolvable, and the test
# environment has no use for the publishing tools.
dev = [
    "build>=1.2",
    "pytest>=8.0",
]
publish = [
    "build>=1.2",
    "twine>=7.0",
]
docs = [
    "mkdocs>=1.6",
    # Floors, not preferences. `>=9.5` admitted the DOM XSS in Material's
    # search suggestions (fixed in 9.7.7), and pymdown-extensions is named
    # explicitly -- rather than left to whatever Material happens to pull --
    # because the ReDoS in its caret/tilde parsing is the higher-severity of
    # the two and a transitive floor is not a floor.
    "mkdocs-material>=9.7.7",
    "pymdown-extensions>=11.0.1",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thalovant"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "LICENSE", "README.md", "mkdocs.yml", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
