[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "thalovant"
version = "0.4.38"
description = "Python SDK and CLI for direct Thalovant hub data-plane clients and agents"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Thalovant" }]
maintainers = [{ name = "Thalovant" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["thalovant", "sdk", "agent", "voice", "assistant", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "hivemind-bus-client>=0.4.4",
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0.2",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://thalovant.com"
Documentation = "https://docs.thalovant.com/developers/sdks/python/"
Repository = "https://github.com/thalovant/thalovant-python-sdk"
Issues = "https://github.com/thalovant/thalovant-python-sdk/issues"

[project.scripts]
thalovant = "thalovant.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "twine>=7.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thalovant"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "LICENSE", "README.md", "mkdocs.yml", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
