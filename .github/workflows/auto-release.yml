name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release unpublished version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thalovant
    env:
      PYPI_API_TOKEN_FROM_SECRET: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          print(f"version={version}")
          print(f"tag=v{version}")
          PY

      - name: Check existing tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package and release tooling
        if: steps.tag.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        if: steps.tag.outputs.exists == 'false'
        run: python -m pytest -q

      - name: Build distributions
        if: steps.tag.outputs.exists == 'false'
        run: |
          rm -rf dist
          python -m build

      - name: Check distribution metadata
        if: steps.tag.outputs.exists == 'false'
        run: python -m twine check dist/*

      - name: Check whether version is already on PyPI
        if: steps.tag.outputs.exists == 'false'
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/thalovant/{version}/json"
          try:
              with urllib.request.urlopen(url) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  exists = False
              else:
                  raise

          print(f"exists={str(exists).lower()}")
          PY

      - name: Publish skipped
        if: steps.tag.outputs.exists == 'false' && steps.registry.outputs.exists == 'true'
        run: echo "thalovant ${{ steps.version.outputs.version }} is already published on PyPI."

      - name: Publish to PyPI with API token
        if: steps.tag.outputs.exists == 'false' && steps.registry.outputs.exists == 'false' && env.PYPI_API_TOKEN_FROM_SECRET != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI with trusted publishing
        if: steps.tag.outputs.exists == 'false' && steps.registry.outputs.exists == 'false' && env.PYPI_API_TOKEN_FROM_SECRET == ''
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI version
        if: steps.tag.outputs.exists == 'false'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/thalovant/{version}/json"
          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(url) as response:
                      if response.status == 200:
                          print(f"Verified thalovant {version} on PyPI.")
                          raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              time.sleep(10)

          raise SystemExit(f"thalovant {version} was not visible on PyPI after waiting.")
          PY

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"
