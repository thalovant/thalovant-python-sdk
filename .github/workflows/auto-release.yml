name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release unpublished version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thalovant
    env:
      PYPI_API_TOKEN_FROM_SECRET: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Plan automatic release
        id: plan
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          relevant_paths = ("src", "pyproject.toml", "README.md", "LICENSE")

          def git(*args: str, check: bool = True) -> str:
              result = subprocess.run(
                  ["git", *args],
                  check=check,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              return result.stdout.strip()

          def tag_exists(tag: str) -> bool:
              return subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0

          def version() -> str:
              with open("pyproject.toml", "rb") as pyproject:
                  return tomllib.load(pyproject)["project"]["version"]

          def changed_since_latest_tag() -> list[str]:
              latest = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", "--match", "v[0-9]*"],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  text=True,
              )
              if latest.returncode != 0:
                  return ["<initial-release>"]
              return [
                  line
                  for line in git("diff", "--name-only", f"{latest.stdout.strip()}..HEAD").splitlines()
                  if line
              ]

          def is_relevant(path: str) -> bool:
              return any(path == prefix or path.startswith(f"{prefix}/") for prefix in relevant_paths)

          def bump_patch(current: str) -> str:
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current)
              if not match:
                  raise SystemExit(f"Cannot auto-bump non-standard version: {current}")
              major, minor, patch = (int(part) for part in match.groups())
              return f"{major}.{minor}.{patch + 1}"

          def replace(path: str, old: str, new: str) -> None:
              file_path = pathlib.Path(path)
              file_path.write_text(file_path.read_text().replace(old, new))

          changed = changed_since_latest_tag()
          if changed != ["<initial-release>"] and not any(is_relevant(path) for path in changed):
              current = version()
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("release_needed=false\n")
                  output.write(f"version={current}\n")
                  output.write(f"tag=v{current}\n")
                  output.write(f"release_sha={git('rev-parse', 'HEAD')}\n")
              print("No release-relevant SDK changes since the latest tag.")
              raise SystemExit(0)

          current = version()
          current_tag = f"v{current}"
          if tag_exists(current_tag):
              next_version = bump_patch(current)
              replace("pyproject.toml", f'version = "{current}"', f'version = "{next_version}"')
              replace("src/thalovant/__init__.py", f'__version__ = "{current}"', f'__version__ = "{next_version}"')
              replace("src/thalovant/client.py", f"ThalovantPythonSDK/{current}", f"ThalovantPythonSDK/{next_version}")
              git("config", "user.name", "github-actions[bot]")
              git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
              git("add", "pyproject.toml", "src/thalovant/__init__.py", "src/thalovant/client.py")
              git("commit", "-m", f"release: bump Python SDK to {next_version}")
              git("push", "origin", "HEAD:main")
              current = next_version

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("release_needed=true\n")
              output.write(f"version={current}\n")
              output.write(f"tag=v{current}\n")
              output.write(f"release_sha={git('rev-parse', 'HEAD')}\n")
          PY

      - name: Install package and release tooling
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        if: steps.plan.outputs.release_needed == 'true'
        run: python -m pytest -q

      - name: Build distributions
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          rm -rf dist
          python -m build

      - name: Check distribution metadata
        if: steps.plan.outputs.release_needed == 'true'
        run: python -m twine check dist/*

      - name: Check whether version is already on PyPI
        if: steps.plan.outputs.release_needed == 'true'
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/thalovant/{version}/json"
          try:
              with urllib.request.urlopen(url) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  exists = False
              else:
                  raise

          print(f"exists={str(exists).lower()}")
          PY

      - name: Publish skipped
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.exists == 'true'
        run: echo "thalovant ${{ steps.plan.outputs.version }} is already published on PyPI."

      - name: Publish to PyPI with API token
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.exists == 'false' && env.PYPI_API_TOKEN_FROM_SECRET != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI with trusted publishing
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.exists == 'false' && env.PYPI_API_TOKEN_FROM_SECRET == ''
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI version
        if: steps.plan.outputs.release_needed == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/thalovant/{version}/json"
          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(url) as response:
                      if response.status == 200:
                          print(f"Verified thalovant {version} on PyPI.")
                          raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              time.sleep(10)

          raise SystemExit(f"thalovant {version} was not visible on PyPI after waiting.")
          PY

      - name: Create GitHub release
        if: steps.plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
        run: gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --notes "Release $TAG"
