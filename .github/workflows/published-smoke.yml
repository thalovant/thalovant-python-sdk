name: Published package smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published PyPI version to verify
        required: true
        default: 0.4.19

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install from PyPI in a clean virtual environment
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/thalovant-smoke"
          "$RUNNER_TEMP/thalovant-smoke/bin/python" -m pip install --upgrade pip
          for attempt in $(seq 1 12); do
            if "$RUNNER_TEMP/thalovant-smoke/bin/python" -m pip install --no-cache-dir "thalovant==$PACKAGE_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "thalovant $PACKAGE_VERSION was not installable from PyPI after waiting."
              exit 1
            fi
            echo "PyPI simple index has not exposed thalovant $PACKAGE_VERSION yet; retrying in 10 seconds."
            sleep 10
          done
          "$RUNNER_TEMP/thalovant-smoke/bin/python" -c 'import importlib.metadata, thalovant; assert importlib.metadata.version("thalovant") == __import__("os").environ["PACKAGE_VERSION"]'
