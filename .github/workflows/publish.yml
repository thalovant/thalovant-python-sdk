name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag to check out and attach evidence to
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/thalovant
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PYPI_API_TOKEN_FROM_SECRET: ${{ secrets.PYPI_API_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install package and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as pyproject:
              version = tomllib.load(pyproject)["project"]["version"]
          print(f"version={version}")
          PY

      - name: Verify release tag matches the package version
        if: env.RELEASE_TAG != ''
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Check whether version is already on PyPI
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/thalovant/{version}/json"
          try:
              with urllib.request.urlopen(url) as response:
                  exists = response.status == 200
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  exists = False
              else:
                  raise

          print(f"exists={str(exists).lower()}")
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Build distributions
        run: |
          rm -rf dist
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Build reproducible CycloneDX SBOM from the wheel
        id: artifacts
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          runtime_venv="$RUNNER_TEMP/thalovant-sbom-runtime"
          tooling_venv="$RUNNER_TEMP/thalovant-sbom-tooling"
          python -m venv "$runtime_venv"
          python -m venv "$tooling_venv"
          "$runtime_venv/bin/python" -m pip install dist/*.whl
          "$tooling_venv/bin/python" -m pip install cyclonedx-bom==7.3.0
          mkdir -p release-artifacts
          "$tooling_venv/bin/cyclonedx-py" environment "$runtime_venv/bin/python" \
            --pyproject pyproject.toml --mc-type library --output-reproducible \
            --spec-version 1.6 --output-format JSON \
            --output-file "release-artifacts/thalovant-$PACKAGE_VERSION.cdx.json"
          echo "sbom=$GITHUB_WORKSPACE/release-artifacts/thalovant-$PACKAGE_VERSION.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest distribution SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: ${{ steps.artifacts.outputs.sbom }}

      - name: Publish skipped
        if: steps.registry.outputs.exists == 'true'
        run: echo "thalovant ${{ steps.version.outputs.version }} is already published on PyPI."

      - name: Publish to PyPI with API token
        if: steps.registry.outputs.exists == 'false' && env.PYPI_API_TOKEN_FROM_SECRET != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI with trusted publishing
        if: steps.registry.outputs.exists == 'false' && env.PYPI_API_TOKEN_FROM_SECRET == ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Verify PyPI version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/thalovant/{version}/json"
          for attempt in range(1, 13):
              try:
                  with urllib.request.urlopen(url) as response:
                      if response.status == 200:
                          print(f"Verified thalovant {version} on PyPI.")
                          raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              time.sleep(10)

          raise SystemExit(f"thalovant {version} was not visible on PyPI after waiting.")
          PY

      - name: Attach distributions and SBOM to the GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM: ${{ steps.artifacts.outputs.sbom }}
        run: |
          EXISTING_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -print | sort)
          artifacts+=("$SBOM")
          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            if grep -Fxq "$name" <<< "$EXISTING_ASSETS"; then
              echo "$name is already attached to $RELEASE_TAG; preserving the existing asset."
            else
              gh release upload "$RELEASE_TAG" "$artifact"
            fi
          done
