name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Exercise minimum security-fixed HTTP and crypto versions
        if: matrix.python-version == '3.10'
        run: python -m pip install 'requests==2.33.0' 'cryptography==50.0.0'

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Check package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          # Building a distribution needs neither the package installed nor
          # its runtime dependencies. twine runs isolated below because it
          # needs rich>=14.3.3 while ovos-utils (via hivemind-bus-client)
          # pins rich~=13.7.
          python -m pip install build

      - name: Build distributions
        run: |
          rm -rf dist
          python -m build

      - name: Check distribution metadata
        run: pipx run twine check dist/*


  dependency-audit:
    name: Audit ${{ matrix.scope }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [runtime, docs]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the selected dependency surface
        env:
          AUDIT_SCOPE: ${{ matrix.scope }}
        run: |
          python -m pip install --upgrade pip
          if [ "$AUDIT_SCOPE" = docs ]; then
            python -m pip install '.[docs]'
          else
            python -m pip install .
          fi
      - name: Audit installed dependencies
        run: pipx run pip-audit --path "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
