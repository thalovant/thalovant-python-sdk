name: Release Guard

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  version:
    name: Check SDK release plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check release version
        env:
          BASE_REF_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PACKAGE_KIND: python
          RELEASE_RELEVANT_PATHS: |
            src
            pyproject.toml
            README.md
            LICENSE
        run: python .github/scripts/release_guard.py
