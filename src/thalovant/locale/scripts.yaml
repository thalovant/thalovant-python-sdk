# What the code knows about writing systems, as opposed to languages: which
# marks close a sentence and which break a clause. A language file says
# which words belong to a language; no word list can say this.
#
# The spaced marks need whitespace after them ("3.5" is a number, not two
# sentences); the unspaced ones -- CJK, Arabic -- are followed by nothing at
# all. Semicolons close a sentence too: measured on the voice satellite, the
# synthesiser already splits "One thing; another thing; a third." in three.
sentence_ends:
  spaced: ".!?…;"
  unspaced: "。！？；؟"

# Marks that break a sentence into clauses: where playback can start before
# the first sentence is whole.
clause_breaks:
  spaced: ",;:"
  unspaced: "，、；،"
