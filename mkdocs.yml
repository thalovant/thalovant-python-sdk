site_name: Thalovant Python SDK
site_description: Python SDK and CLI for direct Thalovant HiveMind HTTPS clients and agents.
site_url: https://thalovant.github.io/thalovant-python-sdk/
repo_name: thalovant/thalovant-python-sdk
repo_url: https://github.com/thalovant/thalovant-python-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            heading_level: 2
            members_order: source
            separate_signature: true
            show_bases: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Concepts: concepts.md
  - Guides:
      - Conversations And Agents: guides/conversations-and-agents.md
      - CLI: cli.md
      - Deployment: deployment.md
  - API:
      - Overview: api-reference.md
      - Generated Reference:
          - Client: reference/client.md
          - Conversations: reference/conversation.md
          - Agents: reference/agent.md
          - Events: reference/events.md
          - Identity: reference/identity.md
          - Models: reference/models.md
          - Errors: reference/errors.md
